[pytest]
# Run from the backend/ directory:  pytest -c tests/pytest.ini  (or just `pytest tests/`)
# The async tests also carry explicit @pytest.mark.asyncio markers, so they work
# even if this config isn't picked up (e.g. when invoked as `pytest tests/`).
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
